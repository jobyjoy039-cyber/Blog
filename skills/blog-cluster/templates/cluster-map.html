<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Cluster Map</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      padding: 20px 28px 12px;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    header h1 { font-size: 18px; font-weight: 600; color: #e6edf3; }
    header p  { font-size: 12px; color: #8b949e; margin-top: 2px; }
    .meta { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge-hub    { background: #1a3a5c; color: #58a6ff; border: 1px solid #1f6feb; }
    .badge-spoke  { background: #1a3a2a; color: #3fb950; border: 1px solid #238636; }
    .badge-gap    { background: #3a2d0f; color: #d29922; border: 1px solid #9e6a03; }
    .badge-count  { background: #161b22; color: #8b949e; border: 1px solid #30363d; }

    /* ── Controls ── */
    .controls {
      padding: 12px 28px;
      border-bottom: 1px solid #30363d;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls label { font-size: 12px; color: #8b949e; margin-right: 4px; }
    .btn {
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover, .btn.active {
      background: #1f2429;
      border-color: #58a6ff;
      color: #58a6ff;
    }
    .search-box {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #c9d1d9;
      font-size: 12px;
      font-family: inherit;
      width: 200px;
    }
    .search-box:focus { outline: none; border-color: #58a6ff; }

    /* ── Layout ── */
    .layout { display: flex; height: calc(100vh - 112px); }
    .sidebar {
      width: 220px;
      min-width: 180px;
      border-right: 1px solid #30363d;
      overflow-y: auto;
      padding: 12px 0;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      padding: 0 14px 8px;
    }
    .cluster-nav-item {
      padding: 7px 14px;
      cursor: pointer;
      border-left: 3px solid transparent;
      font-size: 13px;
      transition: all 0.12s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cluster-nav-item:hover { background: #161b22; }
    .cluster-nav-item.active {
      border-left-color: #58a6ff;
      background: #161b22;
      color: #58a6ff;
    }
    .cluster-nav-item .node-count {
      float: right;
      font-size: 11px;
      color: #8b949e;
    }

    /* ── Canvas ── */
    .canvas-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    #cluster-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #cluster-svg:active { cursor: grabbing; }

    /* ── SVG node styles ── */
    .node-hub circle     { fill: #1a3a5c; stroke: #58a6ff; stroke-width: 2.5; }
    .node-spoke circle   { fill: #1a3a2a; stroke: #3fb950; stroke-width: 1.5; }
    .node-gap circle     { fill: #3a2d0f; stroke: #d29922; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .node-hub text       { fill: #58a6ff; font-weight: 600; }
    .node-spoke text     { fill: #3fb950; }
    .node-gap text       { fill: #d29922; }
    .node circle         { transition: r 0.15s; cursor: pointer; }
    .node:hover circle   { r: attr(r) + 4; filter: brightness(1.3); }
    .edge               { stroke: #30363d; stroke-width: 1.2; opacity: 0.7; }
    .edge-gap           { stroke: #9e6a03; stroke-width: 1; stroke-dasharray: 4 3; opacity: 0.5; }

    /* ── Detail panel ── */
    .detail-panel {
      width: 280px;
      min-width: 240px;
      border-left: 1px solid #30363d;
      overflow-y: auto;
      padding: 16px;
      flex-shrink: 0;
      display: none;
    }
    .detail-panel.open { display: block; }
    .detail-panel h3 { font-size: 14px; color: #e6edf3; margin-bottom: 8px; }
    .detail-panel .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      margin-bottom: 10px;
    }
    .detail-field { margin-bottom: 10px; }
    .detail-field label { font-size: 11px; color: #8b949e; display: block; margin-bottom: 2px; }
    .detail-field span  { font-size: 13px; }
    .detail-actions { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
    .detail-action-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #c9d1d9;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s;
    }
    .detail-action-btn:hover { background: #1f2429; border-color: #58a6ff; color: #58a6ff; }

    /* ── Legend ── */
    .legend {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 11px;
      pointer-events: none;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .legend-item:last-child { margin-bottom: 0; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    /* ── Tooltip ── */
    #tooltip {
      position: absolute;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      z-index: 100;
      max-width: 220px;
    }
    #tooltip .tt-title { font-weight: 600; color: #e6edf3; margin-bottom: 4px; }
    #tooltip .tt-meta  { color: #8b949e; font-size: 11px; }
  </style>
</head>
<body>

<header>
  <div>
    <h1 id="map-title">Topic Cluster Map</h1>
    <p id="map-subtitle">Generated by /blog cluster</p>
  </div>
  <div class="meta">
    <span class="badge badge-hub" id="hub-count">0 Hubs</span>
    <span class="badge badge-spoke" id="spoke-count">0 Spokes</span>
    <span class="badge badge-gap" id="gap-count">0 Gaps</span>
    <span class="badge badge-count" id="total-count">0 Total</span>
  </div>
</header>

<div class="controls">
  <label>Show:</label>
  <button class="btn active" onclick="filterNodes('all', this)">All</button>
  <button class="btn" onclick="filterNodes('hub', this)">Hubs</button>
  <button class="btn" onclick="filterNodes('spoke', this)">Spokes</button>
  <button class="btn" onclick="filterNodes('gap', this)">Gaps only</button>
  <input class="search-box" id="search" placeholder="Search keywords…" oninput="searchNodes(this.value)">
  <button class="btn" onclick="resetView()" style="margin-left:auto">Reset view</button>
  <button class="btn" onclick="exportSVG()">Export SVG</button>
</div>

<div class="layout">

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title">Clusters</div>
    <!-- Cluster nav items injected by JS -->
  </nav>

  <div class="canvas-wrap">
    <svg id="cluster-svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#30363d"/>
        </marker>
      </defs>
      <g id="zoom-group">
        <!-- Edges and nodes rendered here by JS -->
      </g>
    </svg>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#1a3a5c;border:2px solid #58a6ff;"></div>
        Hub (pillar post)
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#1a3a2a;border:1.5px solid #3fb950;"></div>
        Spoke (existing)
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#3a2d0f;border:1.5px dashed #d29922;"></div>
        Gap (not yet written)
      </div>
    </div>

    <div id="tooltip">
      <div class="tt-title" id="tt-title"></div>
      <div class="tt-meta" id="tt-meta"></div>
    </div>
  </div>

  <aside class="detail-panel" id="detail-panel">
    <h3 id="dp-title">Node details</h3>
    <span class="pill" id="dp-badge"></span>
    <div class="detail-field">
      <label>Primary Keyword</label>
      <span id="dp-keyword">—</span>
    </div>
    <div class="detail-field">
      <label>Search Intent</label>
      <span id="dp-intent">—</span>
    </div>
    <div class="detail-field">
      <label>Difficulty</label>
      <span id="dp-difficulty">—</span>
    </div>
    <div class="detail-field">
      <label>Target Word Count</label>
      <span id="dp-words">—</span>
    </div>
    <div class="detail-field">
      <label>Status</label>
      <span id="dp-status">—</span>
    </div>
    <div class="detail-field">
      <label>File</label>
      <span id="dp-file" style="font-size:11px;color:#8b949e;word-break:break-all;">—</span>
    </div>
    <div class="detail-actions">
      <button class="detail-action-btn" id="dp-action-write">✏️ /blog write "[keyword]"</button>
      <button class="detail-action-btn" id="dp-action-brief">📋 /blog brief "[keyword]"</button>
      <button class="detail-action-btn" id="dp-action-analyze">📊 /blog analyze "[file]"</button>
    </div>
  </aside>

</div>

<script>
// ── Cluster data (injected by blog-cluster skill) ──────────────────────────
// Replace CLUSTER_DATA with the actual JSON output from /blog cluster
const CLUSTER_DATA = window.CLUSTER_DATA || {
  title: "Topic Cluster Map",
  subtitle: "Generated by /blog cluster",
  generated: new Date().toISOString().split('T')[0],
  clusters: [
    {
      id: "example-cluster",
      name: "Example Cluster",
      hub: {
        id: "hub-1",
        title: "The Complete Guide to [Topic]",
        keyword: "[primary keyword]",
        intent: "Informational",
        difficulty: "Hard (68)",
        words: 4000,
        status: "gap",
        file: null
      },
      spokes: [
        {
          id: "spoke-1",
          title: "[Subtopic] Guide",
          keyword: "[subtopic keyword]",
          intent: "Informational",
          difficulty: "Medium (42)",
          words: 1500,
          status: "exists",
          file: "posts/subtopic-guide.md"
        },
        {
          id: "spoke-2",
          title: "How to [Action]",
          keyword: "how to [action]",
          intent: "Informational",
          difficulty: "Easy (28)",
          words: 1200,
          status: "gap",
          file: null
        }
      ]
    }
  ]
};

// ── Build node + edge lists ────────────────────────────────────────────────
const nodes = [];
const edges = [];
const clusters = CLUSTER_DATA.clusters;

document.getElementById('map-title').textContent = CLUSTER_DATA.title || 'Topic Cluster Map';
document.getElementById('map-subtitle').textContent = CLUSTER_DATA.subtitle || '';

clusters.forEach((cluster, ci) => {
  const hub = { ...cluster.hub, type: 'hub', cluster: cluster.id, clusterName: cluster.name };
  nodes.push(hub);
  cluster.spokes.forEach(spoke => {
    const n = { ...spoke, type: spoke.status === 'gap' ? 'gap' : 'spoke', cluster: cluster.id, clusterName: cluster.name };
    nodes.push(n);
    edges.push({ source: hub.id, target: spoke.id, gap: spoke.status === 'gap' });
  });
});

// Update badge counts
const hubCount   = nodes.filter(n => n.type === 'hub').length;
const spokeCount = nodes.filter(n => n.type === 'spoke').length;
const gapCount   = nodes.filter(n => n.type === 'gap').length;
document.getElementById('hub-count').textContent   = hubCount + ' Hub' + (hubCount !== 1 ? 's' : '');
document.getElementById('spoke-count').textContent = spokeCount + ' Spoke' + (spokeCount !== 1 ? 's' : '');
document.getElementById('gap-count').textContent   = gapCount + ' Gap' + (gapCount !== 1 ? 's' : '');
document.getElementById('total-count').textContent = nodes.length + ' Total';

// ── Sidebar nav ───────────────────────────────────────────────────────────
const sidebar = document.getElementById('sidebar');
clusters.forEach(cluster => {
  const count = 1 + cluster.spokes.length;
  const item = document.createElement('div');
  item.className = 'cluster-nav-item';
  item.setAttribute('data-cluster', cluster.id);
  item.innerHTML = cluster.name + '<span class="node-count">' + count + '</span>';
  item.onclick = () => focusCluster(cluster.id, item);
  sidebar.appendChild(item);
});

// ── Force-directed layout (simple spring simulation) ─────────────────────
const svg   = document.getElementById('cluster-svg');
const group = document.getElementById('zoom-group');
let W = svg.clientWidth  || 800;
let H = svg.clientHeight || 600;
const cx = W / 2, cy = H / 2;

// Initial positions: hubs on a circle, spokes around their hub
const clusterCount = clusters.length;
const angleStep = (2 * Math.PI) / Math.max(clusterCount, 1);
const hubRadius = Math.min(W, H) * 0.28;

nodes.forEach(node => {
  if (node.type === 'hub') {
    const ci = clusters.findIndex(c => c.id === node.cluster);
    const angle = ci * angleStep - Math.PI / 2;
    node.x = cx + hubRadius * Math.cos(angle);
    node.y = cy + hubRadius * Math.sin(angle);
  }
});
nodes.forEach(node => {
  if (node.type !== 'hub') {
    const hub = nodes.find(n => n.type === 'hub' && n.cluster === node.cluster);
    const siblings = nodes.filter(n => n.cluster === node.cluster && n.type !== 'hub');
    const si = siblings.indexOf(node);
    const a = (si / Math.max(siblings.length, 1)) * 2 * Math.PI;
    const r = 120 + Math.random() * 40;
    node.x = (hub ? hub.x : cx) + r * Math.cos(a);
    node.y = (hub ? hub.y : cy) + r * Math.sin(a);
  }
  node.vx = 0; node.vy = 0;
});

// Simple force simulation (50 ticks)
for (let tick = 0; tick < 80; tick++) {
  // Repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const force = 3200 / (dist * dist);
      a.vx -= force * dx / dist; a.vy -= force * dy / dist;
      b.vx += force * dx / dist; b.vy += force * dy / dist;
    }
  }
  // Spring attraction on edges
  edges.forEach(e => {
    const a = nodes.find(n => n.id === e.source);
    const b = nodes.find(n => n.id === e.target);
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const target = 150;
    const force = (dist - target) * 0.04;
    a.vx += force * dx / dist; a.vy += force * dy / dist;
    b.vx -= force * dx / dist; b.vy -= force * dy / dist;
  });
  // Center gravity
  nodes.forEach(n => { n.vx += (cx - n.x) * 0.004; n.vy += (cy - n.y) * 0.004; });
  // Apply + damp
  nodes.forEach(n => { n.x += n.vx * 0.6; n.y += n.vy * 0.6; n.vx *= 0.7; n.vy *= 0.7; });
}

// ── Render SVG ─────────────────────────────────────────────────────────────
function render(visibleNodes, visibleEdges) {
  group.innerHTML = '';

  // Edges
  visibleEdges.forEach(e => {
    const a = visibleNodes.find(n => n.id === e.source);
    const b = visibleNodes.find(n => n.id === e.target);
    if (!a || !b) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('class', e.gap ? 'edge edge-gap' : 'edge');
    group.appendChild(line);
  });

  // Nodes
  visibleNodes.forEach(node => {
    const r = node.type === 'hub' ? 36 : 22;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class', 'node node-' + node.type);
    g.setAttribute('transform', `translate(${node.x},${node.y})`);
    g.setAttribute('data-id', node.id);

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('r', r);
    g.appendChild(circle);

    // Label (truncated)
    const label = (node.keyword || node.title || '').slice(0, 22) + ((node.keyword || '').length > 22 ? '…' : '');
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('text-anchor','middle');
    text.setAttribute('dominant-baseline','middle');
    text.setAttribute('font-size', node.type === 'hub' ? '11' : '10');
    text.setAttribute('pointer-events','none');
    // Word wrap: split into 2 lines if long
    const words = label.split(' ');
    if (words.length > 2 && node.type !== 'hub') {
      const mid = Math.ceil(words.length / 2);
      const line1 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
      line1.setAttribute('x','0'); line1.setAttribute('dy','-6');
      line1.textContent = words.slice(0, mid).join(' ');
      const line2 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
      line2.setAttribute('x','0'); line2.setAttribute('dy','13');
      line2.textContent = words.slice(mid).join(' ');
      text.appendChild(line1); text.appendChild(line2);
    } else {
      text.textContent = label;
    }
    g.appendChild(text);

    // Status dot for gap nodes
    if (node.type === 'gap') {
      const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
      dot.setAttribute('cx', r - 4); dot.setAttribute('cy', -(r - 4));
      dot.setAttribute('r','5');
      dot.setAttribute('fill','#d29922');
      g.appendChild(dot);
    }

    // Tooltip + click
    g.addEventListener('mouseenter', e => showTooltip(node, e));
    g.addEventListener('mousemove',  e => moveTooltip(e));
    g.addEventListener('mouseleave', hideTooltip);
    g.addEventListener('click', () => openDetail(node));

    group.appendChild(g);
  });
}

render(nodes, edges);

// ── Zoom + pan ─────────────────────────────────────────────────────────────
let scale = 1, tx = 0, ty = 0, dragging = false, lastX, lastY;
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.min(Math.max(scale * delta, 0.2), 5);
  applyTransform();
});
svg.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup',  () => { dragging = false; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx += e.clientX - lastX; ty += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
function applyTransform() {
  group.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}
function resetView() { scale = 1; tx = 0; ty = 0; applyTransform(); }

// ── Filter ────────────────────────────────────────────────────────────────
function filterNodes(type, btn) {
  document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const vis = type === 'all' ? nodes : nodes.filter(n => n.type === type || (type === 'gap' && n.type === 'gap'));
  const visIds = new Set(vis.map(n => n.id));
  const visEdges = edges.filter(e => visIds.has(e.source) && visIds.has(e.target));
  render(vis, visEdges);
}

function focusCluster(clusterId, navItem) {
  document.querySelectorAll('.cluster-nav-item').forEach(i => i.classList.remove('active'));
  navItem.classList.add('active');
  const vis = nodes.filter(n => n.cluster === clusterId);
  const visIds = new Set(vis.map(n => n.id));
  const visEdges = edges.filter(e => visIds.has(e.source) && visIds.has(e.target));
  render(vis, visEdges);
}

function searchNodes(q) {
  if (!q) { render(nodes, edges); return; }
  const lower = q.toLowerCase();
  const vis = nodes.filter(n =>
    (n.keyword || '').toLowerCase().includes(lower) ||
    (n.title || '').toLowerCase().includes(lower)
  );
  const visIds = new Set(vis.map(n => n.id));
  const visEdges = edges.filter(e => visIds.has(e.source) && visIds.has(e.target));
  render(vis, visEdges);
}

// ── Tooltip ───────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTooltip(node, e) {
  document.getElementById('tt-title').textContent = node.title || node.keyword;
  document.getElementById('tt-meta').textContent =
    [node.intent, node.difficulty, node.words ? node.words + ' words' : ''].filter(Boolean).join(' · ');
  tooltip.style.display = 'block';
  moveTooltip(e);
}
function moveTooltip(e) {
  tooltip.style.left = (e.clientX + 14) + 'px';
  tooltip.style.top  = (e.clientY - 10) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

// ── Detail panel ──────────────────────────────────────────────────────────
const panel = document.getElementById('detail-panel');
function openDetail(node) {
  panel.classList.add('open');
  document.getElementById('dp-title').textContent = node.title || node.keyword;
  const badge = document.getElementById('dp-badge');
  badge.textContent = node.type === 'hub' ? 'Hub' : node.type === 'gap' ? 'Gap' : 'Spoke';
  badge.className = 'pill ' + (node.type === 'hub' ? 'badge-hub' : node.type === 'gap' ? 'badge-gap' : 'badge-spoke');
  document.getElementById('dp-keyword').textContent    = node.keyword || '—';
  document.getElementById('dp-intent').textContent     = node.intent || '—';
  document.getElementById('dp-difficulty').textContent = node.difficulty || '—';
  document.getElementById('dp-words').textContent      = node.words ? node.words.toLocaleString() + ' words' : '—';
  document.getElementById('dp-status').textContent     = node.status === 'gap' ? '⚠️ Not written yet' : node.status === 'exists' ? '✅ Published' : node.status || '—';
  document.getElementById('dp-file').textContent       = node.file || '—';
  const kw = node.keyword || node.title || '';
  document.getElementById('dp-action-write').textContent   = `✏️ /blog write "${kw}"`;
  document.getElementById('dp-action-brief').textContent   = `📋 /blog brief "${kw}"`;
  document.getElementById('dp-action-analyze').textContent = node.file ? `📊 /blog analyze "${node.file}"` : `📊 /blog analyze (no file yet)`;
}

// ── Export SVG ────────────────────────────────────────────────────────────
function exportSVG() {
  const data = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([data], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cluster-map.svg';
  a.click();
}
</script>
</body>
</html>
