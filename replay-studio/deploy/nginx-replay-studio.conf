# Alternative to Caddy. Obtain certificates with certbot: sudo certbot --nginx -d replay.example.com
server {
    listen 443 ssl http2;
    server_name replay.example.com;
    ssl_certificate     /etc/letsencrypt/live/replay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replay.example.com/privkey.pem;
    client_max_body_size 64m;          # upload chunks are 8 MB by default
    proxy_request_buffering off;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
server { listen 80; server_name replay.example.com; return 301 https://$host$request_uri; }
