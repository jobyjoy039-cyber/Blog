[project]
name = "replay-studio"
version = "1.0.0"
description = "Loop a local video into a single YouTube live broadcast until you press Stop."
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",              # plain uvicorn: no Rust/C extras, installs on Android (Termux)
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "tzdata",
]

[project.optional-dependencies]
# fastapi is only used by the test/demo fake YouTube server, never by the app itself.
test = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi>=0.115"]

[project.scripts]
replay-studio = "replay_studio.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["replay_studio*"]

[tool.setuptools.package-data]
replay_studio = ["static/**/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
