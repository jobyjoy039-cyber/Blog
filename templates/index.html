<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Image Upscaler — Real-ESRGAN</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Real-ESRGAN Upscaler</span>
        </div>
        <p class="tagline">Upscale multiple images at once using AI super-resolution</p>
      </div>
    </header>

    <main class="main">
      <!-- Settings Panel -->
      <section class="panel settings-panel">
        <h2 class="panel-title">Settings</h2>
        <div class="settings-grid">
          <div class="field">
            <label for="model-select">Model</label>
            <div class="select-wrap">
              <select id="model-select">
                {% for key, cfg in models.items() %}
                <option value="{{ key }}" {% if key == 'RealESRGAN_x4plus' %}selected{% endif %}>
                  {{ cfg.label }}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="field">
            <label for="outscale">Output Scale</label>
            <div class="scale-control">
              <button class="scale-btn" data-delta="-0.5">−</button>
              <input type="number" id="outscale" value="4" min="1" max="8" step="0.5" />
              <button class="scale-btn" data-delta="0.5">+</button>
              <span class="scale-unit">×</span>
            </div>
          </div>

          <div class="field">
            <label for="tile-size">Tile Size <span class="hint">(0 = no tiling)</span></label>
            <div class="select-wrap">
              <select id="tile-size">
                <option value="0">None (full image)</option>
                <option value="256">256 px</option>
                <option value="400">400 px</option>
                <option value="512">512 px</option>
              </select>
            </div>
          </div>

          <div class="field field-toggle">
            <label for="fp32-toggle">FP32 Precision</label>
            <label class="toggle">
              <input type="checkbox" id="fp32-toggle" />
              <span class="slider"></span>
            </label>
            <span class="hint">Slower but more compatible</span>
          </div>
        </div>
      </section>

      <!-- Upload Panel -->
      <section class="panel upload-panel">
        <h2 class="panel-title">Images</h2>
        <div class="drop-zone" id="drop-zone">
          <div class="drop-icon">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M24 8v24M16 16l8-8 8 8"/>
              <rect x="6" y="32" width="36" height="10" rx="2"/>
            </svg>
          </div>
          <p class="drop-text">Drop images here or <label for="file-input" class="file-label">browse</label></p>
          <p class="drop-hint">JPG, PNG, WEBP, BMP, TIFF — up to 100 MB total</p>
          <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.png,.webp,.bmp,.tiff,.tif" hidden />
        </div>

        <div class="file-list" id="file-list" hidden></div>

        <div class="actions">
          <button class="btn btn-secondary" id="clear-btn" disabled>Clear All</button>
          <button class="btn btn-primary" id="upscale-btn" disabled>
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path d="M3 3h5v5H3zm9 0h5v5h-5zm0 9h5v5h-5zM3 12h5v5H3z"/>
            </svg>
            Upscale Images
          </button>
        </div>
      </section>

      <!-- Progress Panel -->
      <section class="panel progress-panel" id="progress-panel" hidden>
        <h2 class="panel-title">Processing</h2>
        <div class="progress-wrap">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <span class="progress-label" id="progress-label">0 / 0</span>
        </div>
        <p class="progress-status" id="progress-status">Initializing…</p>
        <div class="progress-items" id="progress-items"></div>
      </section>

      <!-- Results Panel -->
      <section class="panel results-panel" id="results-panel" hidden>
        <div class="results-header">
          <h2 class="panel-title">Results</h2>
          <div class="results-actions">
            <button class="btn btn-secondary" id="new-job-btn">New Job</button>
            <button class="btn btn-primary" id="download-all-btn">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 14l-4-4h3V3h2v7h3l-4 4z"/>
                <path d="M3 17h14v-2H3v2z"/>
              </svg>
              Download All (ZIP)
            </button>
          </div>
        </div>
        <div class="results-grid" id="results-grid"></div>
      </section>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
