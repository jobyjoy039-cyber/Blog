plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stykanimate.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stykanimate.ai'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // The editor ships .wasm/.zip runtimes; keep them stored uncompressed for fast reads.
        noCompress += ['wasm', 'zip', 'whl']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
