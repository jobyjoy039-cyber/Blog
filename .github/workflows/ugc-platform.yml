name: UGC platform

on:
  push:
    paths: ["ugc-platform/**", ".github/workflows/ugc-platform.yml"]
  pull_request:
    paths: ["ugc-platform/**", ".github/workflows/ugc-platform.yml"]

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ugc-platform/backend
    steps:
      - uses: actions/checkout@v4
      - name: System deps (ffmpeg + caption font)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.11 && uv pip install -e '.[claude,dev]'  # kitten tests skip without the 600 MB extra
      - run: .venv/bin/pytest -q

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ugc-platform/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ugc-ad-studio-debug-apk
          path: ugc-platform/android/app/build/outputs/apk/debug/app-debug.apk
