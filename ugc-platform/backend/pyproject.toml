[project]
name = "ugc-studio"
version = "0.1.0"
description = "Orchestrator backend for the UGC Ad Studio Android app: product link in, platform-ready ad video out."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pillow>=10.3",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
# KittenTTS ships on GitHub releases. Its text frontend pulls in CUDA PyTorch it
# never uses; see README/Dockerfile for removing it (saves ~5 GB).
kitten = ["kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl", "soundfile>=0.12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ugc_studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
